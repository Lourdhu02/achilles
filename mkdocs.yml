# Docs site for Achilles. Build with: python tools/build_docs.py (see that file).
site_name: Achilles
site_description: Core AI from first principles. Build it, measure it, explain it.
site_url: https://lourdhu02.github.io/achilles/
repo_url: https://github.com/Lourdhu02/achilles
repo_name: Lourdhu02/achilles
edit_uri: edit/main/
copyright: MIT License. Built from the Achilles repository.
docs_dir: site_src
site_dir: site
use_directory_urls: false
hooks:
  - tools/docs_hooks.py
validation:
  links:
    not_found: warn
    anchors: warn
    absolute_links: info
    unrecognized_links: info

theme:
  name: material
  favicon: assets/icons/brain-circuit.svg
  logo: assets/icons/brain-circuit-white.svg
  icon:
    repo: fontawesome/brands/github
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - toc.follow

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - tables
  - def_list
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

not_in_nav: |
  /companies/*/refresh-brief.md
  /journal/templates/*.md
  /career/resume/guide.md

