[project]
name = "achilles"
version = "3.0.0"
description = "Core AI from first principles: 18 test-driven labs from autograd to GRPO and mixture of experts, a curriculum, and research-engineer and founder tracks."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Lourdu Raju" }]
keywords = ["llm", "transformers", "pytorch", "triton", "flash-attention", "rlhf", "dpo", "grpo", "quantization", "interpretability"]
dependencies = [
    "numpy>=1.26",
    "regex>=2024.4",
    # RTX 50-series (Blackwell, sm_120) needs a CUDA 12.8+ build: torch>=2.7. See SETUP.md.
    "torch>=2.7",
    "pytest>=8.0",
]

[project.optional-dependencies]
# Scale-up runs: real datasets, the GPT-2 tokenizer and Hugging Face models (same as requirements-data.txt).
data = ["tiktoken>=0.7", "datasets>=2.19", "huggingface_hub>=0.23", "transformers>=5.0"]
# Docs site (same as requirements-docs.txt): python tools/build_docs.py
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5"]

[project.urls]
Homepage = "https://github.com/Lourdhu02/achilles"
Documentation = "https://lourdhu02.github.io/achilles/"
Issues = "https://github.com/Lourdhu02/achilles/issues"

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["labs"]
addopts = "-ra --import-mode=importlib"
pythonpath = ["."]
markers = [
    "slow: takes more than ~10 seconds on a laptop CPU",
    "gpu: needs a CUDA GPU (skipped otherwise)",
]
