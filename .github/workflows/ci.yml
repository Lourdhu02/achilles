name: ci

on:
  push:
  pull_request:

jobs:
  labs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU PyTorch and test deps
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy regex pytest triton
      - name: Reference solutions pass every lab (Triton runs in interpreter mode)
        run: python -m pytest --impl=solution
      - name: Exercise stubs import cleanly
        run: python -m pytest labs --impl=exercise --collect-only -q
      - name: Markdown links resolve
        run: python tools/check_links.py
